name: Individual storefront checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Code, architecture and disclosure checks
        run: node tools/check.mjs
      - name: Install browser tooling outside the application
        run: npm install --prefix "$RUNNER_TEMP/slotdrop-browser-tools" --no-save --package-lock=false playwright@1.56.1
      - name: Install Chromium
        run: node "$RUNNER_TEMP/slotdrop-browser-tools/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Real browser navigation and startup recovery
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/slotdrop-browser-tools/node_modules/playwright/index.mjs
        run: node tools/browser-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: individual-browser-checks
          path: docs/browser-smoke.json
